<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理系统 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 炫彩动态背景 */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background span {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .background span:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
            background: rgba(79, 172, 254, 0.2);
        }

        .background span:nth-child(2) {
            top: 60%;
            left: 80%;
            animation-delay: 2s;
            background: rgba(0, 242, 254, 0.2);
        }

        .background span:nth-child(3) {
            top: 40%;
            left: 40%;
            animation-delay: 4s;
            background: rgba(153, 102, 255, 0.2);
        }

        .background span:nth-child(4) {
            top: 80%;
            left: 20%;
            animation-delay: 6s;
            background: rgba(255, 159, 64, 0.2);
        }

        .background span:nth-child(5) {
            top: 30%;
            left: 70%;
            animation-delay: 8s;
            background: rgba(255, 99, 132, 0.2);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(0) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* 登录容器 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            transform: translateY(-2px);
        }

        /* 按钮样式 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 错误信息 */
        .error-message {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .error-message p {
            color: #721c24;
            font-size: 14px;
            font-weight: 500;
        }

        /* 链接样式 */
        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }

        .lab-link {
            text-align: center;
            margin-top: 14px;
        }

        .lab-link a {
            display: inline-block;
            padding: 9px 16px;
            color: #1565c0;
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .lab-link a:hover {
            color: #0d47a1;
            background: #d5e9fb;
            transform: translateY(-1px);
        }

        /* 系统信息 */
        .system-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .system-info p {
            color: #1565c0;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <!-- 炫彩动态背景 -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>文章管理系统</h1>
            <p>专业的内容管理平台</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div th:if="${error != null}" class="error-message">
                <p th:text="${error}"></p>
            </div>

            <button type="submit" class="btn-submit">登 录</button>
        </form>

        <div class="register-link">
            <p>还没有账号？ <a href="/register">立即注册</a></p>
        </div>

        <div class="lab-link">
            <a href="/lab">进入 SQLi / XSS 实验区</a>
        </div>

        <div class="system-info">
            <p>ℹ️ <strong>系统信息：</strong>本系统用于管理和发布文章内容，支持用户权限管理和内容编辑。</p>
        </div>
    </div>
</body>

</html>
