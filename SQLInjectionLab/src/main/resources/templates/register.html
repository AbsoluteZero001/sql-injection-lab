<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理系统 - 注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 炫彩动态背景 */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background span {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .background span:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
            background: rgba(79, 172, 254, 0.2);
        }

        .background span:nth-child(2) {
            top: 60%;
            left: 80%;
            animation-delay: 2s;
            background: rgba(0, 242, 254, 0.2);
        }

        .background span:nth-child(3) {
            top: 40%;
            left: 40%;
            animation-delay: 4s;
            background: rgba(153, 102, 255, 0.2);
        }

        .background span:nth-child(4) {
            top: 80%;
            left: 20%;
            animation-delay: 6s;
            background: rgba(255, 159, 64, 0.2);
        }

        .background span:nth-child(5) {
            top: 30%;
            left: 70%;
            animation-delay: 8s;
            background: rgba(255, 99, 132, 0.2);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(0) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* 注册容器 */
        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* 按钮样式 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 错误信息 */
        .error-message {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .error-message p {
            color: #721c24;
            font-size: 14px;
            font-weight: 500;
        }

        /* 链接样式 */
        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- 炫彩动态背景 -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="register-container">
        <div class="register-header">
            <h1>用户注册</h1>
            <p>创建新账号，开始使用文章管理系统</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
            </div>

            <div class="form-group">
                <label for="status">状态</label>
                <select id="status" name="status" required>
                    <option value="active">活跃</option>
                    <option value="inactive">非活跃</option>
                </select>
            </div>

            <div class="form-group">
                <label for="role">角色</label>
                <select id="role" name="role" required>
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" name="description" placeholder="请输入描述" rows="3"></textarea>
            </div>

            <div th:if="${registerError != null}" class="error-message">
                <p th:text="${registerError}"></p>
            </div>

            <button type="submit" class="btn-submit">注 册</button>
        </form>

        <div class="login-link">
            <p>已有账号？ <a href="/">立即登录</a></p>
        </div>
    </div>
</body>

</html>
